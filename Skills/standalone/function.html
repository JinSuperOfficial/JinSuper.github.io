<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>函数显示器 · Plot</title>
<style>
  :root{
    --bg:#0E1214; --panel:#13181B; --raised:#191F23; --line:#232C31;
    --ink:#E7E9E6; --dim:#7E8A90; --faint:#566168;
    --accent:#D97757; --lime:#E1FCAD;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ease-out:cubic-bezier(.2,.7,.2,1);
    --ease-in:cubic-bezier(.4,0,1,1);
    --dur-fast:140ms; --dur-base:240ms; --dur-slow:500ms;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Inter","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100dvh}

  /* ═══ 侧栏 ═══ */
  .panel{
    width:370px;flex:none;display:flex;flex-direction:column;gap:20px;
    padding:22px 18px 18px;
    background:linear-gradient(180deg,#14191C 0%,#101417 100%);
    border-right:1px solid var(--line);
    overflow-y:auto;overscroll-behavior:contain;
  }
  .panel::-webkit-scrollbar{width:8px}
  .panel::-webkit-scrollbar-thumb{background:#222A2F;border-radius:4px}

  .head{display:flex;gap:12px;align-items:center}
  .mark{
    width:38px;height:38px;flex:none;display:grid;place-items:center;
    border-radius:6px;background:rgba(215,119,87,.12);
    border:1px solid rgba(215,119,87,.28);color:var(--accent);
  }
  .mark svg{width:20px;height:20px}
  h1{font-size:16px;font-weight:650;margin:0}
  .head p{margin:3px 0 0;font-size:12px;color:var(--faint)}

  .label{
    font-size:10.5px;font-weight:650;letter-spacing:.11em;text-transform:uppercase;
    color:var(--faint);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .label::after{content:'';flex:1;height:1px;background:var(--line)}

  /* ═══ 表达式行 ═══ */
  .fn-list{display:flex;flex-direction:column}
  .fn-slot{
    display:grid;grid-template-rows:1fr;margin-bottom:8px;
    transition:grid-template-rows var(--dur-base) var(--ease-out),
               margin-bottom var(--dur-base) var(--ease-out),
               opacity var(--dur-fast) var(--ease-in);
  }
  .fn-slot:last-child{margin-bottom:0}
  .fn-slot.closing{grid-template-rows:0fr;margin-bottom:0;opacity:0}

  .fn-row{
    min-height:0;overflow:hidden;display:flex;align-items:center;gap:6px;
    background:var(--raised);border:1px solid var(--line);border-radius:6px;
    padding:4px 6px 4px 4px;
    transition:border-color var(--dur-fast) var(--ease-out),
               background var(--dur-fast) var(--ease-out);
  }
  .fn-row:focus-within{border-color:#39434A;background:#1C2328}
  .fn-row.error{border-color:rgba(215,119,87,.6)}
  .fn-row.error .fn-input{color:#F0A98F}
  .fn-row.pen-made{border-color:rgba(225,252,173,.28)}

  @keyframes row-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  .type-badge{
    width:26px;height:26px;flex:none;display:grid;place-items:center;
    background:#141A1E;border:1px solid var(--line);border-radius:5px;
    color:#7A868D;font-family:var(--mono);font-size:11px;font-weight:600;
    cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .type-badge:hover{color:var(--ink);border-color:#3A464E;background:#1C2328}
  .type-badge:active{transform:scale(.94)}

  .swatch{
    width:13px;height:13px;flex:none;border-radius:3px;padding:0;border:none;
    background:var(--c);cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,.10) inset;
    transition:transform var(--dur-fast) var(--ease-out);
  }
  .swatch:hover{transform:scale(1.18)}

  .fn-input{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    color:var(--ink);font-family:var(--mono);font-size:13px;padding:6px 0;
  }
  .fn-input::placeholder{color:#4A555C}

  .icon-btn{
    width:24px;height:24px;flex:none;display:grid;place-items:center;
    background:transparent;border:none;border-radius:4px;color:#5C676E;cursor:pointer;
    transition:color var(--dur-fast) var(--ease-out),
               background var(--dur-fast) var(--ease-out),
               transform var(--dur-fast) var(--ease-out);
  }
  .icon-btn svg{width:15px;height:15px}
  .icon-btn:hover{color:var(--ink);background:rgba(255,255,255,.07)}
  .icon-btn:active{transform:scale(.9)}
  .icon-btn.off{color:#333C42}
  .icon-btn.del:hover{color:#E08A6C}

  .add-btn{
    width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:10px;background:transparent;border:1px dashed #2C363C;border-radius:6px;
    color:#78848A;font-size:12.5px;font-family:inherit;cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .add-btn:hover{border-color:rgba(215,119,87,.55);color:var(--accent);background:rgba(215,119,87,.05);transform:translateY(-1px)}
  .add-btn:active{transform:translateY(0) scale(.99)}

  /* ═══ 快捷示例 ═══ */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-family:var(--mono);font-size:11.5px;padding:5px 9px;
    background:var(--raised);border:1px solid var(--line);border-radius:5px;
    color:#8B959B;cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .chip:hover{color:var(--lime);border-color:#3E4A3A;background:#1A2019;transform:translateY(-1px)}

  /* ═══ 画笔 ═══ */
  .pen-panel{display:flex;gap:8px}
  .pen-toggle{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 12px;background:var(--raised);border:1px solid var(--line);border-radius:6px;
    color:#8B959B;font-size:12.5px;font-family:inherit;cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .pen-toggle:hover{border-color:#3A464E;color:var(--ink);background:#1C2328}
  .pen-toggle.on{border-color:rgba(225,252,173,.55);color:var(--lime);background:rgba(225,252,173,.06)}
  .pen-toggle svg{width:14px;height:14px}
  .pen-icon{
    width:38px;display:grid;place-items:center;background:transparent;
    border:1px solid var(--line);border-radius:6px;color:#78848A;cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .pen-icon svg{width:15px;height:15px}
  .pen-icon:hover{color:var(--ink);border-color:#3A464E}
  .pen-clear{
    padding:9px 12px;background:transparent;border:1px solid var(--line);border-radius:6px;
    color:#78848A;font-size:12.5px;font-family:inherit;cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .pen-clear:hover{color:#E08A6C;border-color:rgba(215,119,87,.45)}

  .pen-row{display:flex;align-items:center;gap:10px;margin-top:12px}
  .pen-row-label{
    font-size:10.5px;color:var(--faint);letter-spacing:.09em;
    text-transform:uppercase;flex:none;width:38px;
  }
  .pen-colors{display:flex;gap:6px;flex:1}
  .pen-color{
    width:20px;height:20px;border-radius:4px;border:2px solid transparent;
    background:var(--c);cursor:pointer;padding:0;
    transition:transform var(--dur-fast) var(--ease-out),
               box-shadow var(--dur-fast) var(--ease-out);
  }
  .pen-color:hover{transform:scale(1.14)}
  .pen-color.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}

  .pen-size{
    flex:1;height:4px;-webkit-appearance:none;appearance:none;
    background:#2A343A;border-radius:2px;outline:none;cursor:pointer;
  }
  .pen-size::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);cursor:pointer;
  }
  .pen-size::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--ink);border:none;cursor:pointer;
  }

  /* ═══ 设置 ═══ */
  .setting-row{
    display:flex;align-items:center;gap:10px;padding:6px 0;
    font-size:12.5px;color:#8B959B;
  }
  .setting-row label{flex:1;cursor:pointer}
  .switch{
    position:relative;width:32px;height:18px;flex:none;
    background:#222A2F;border-radius:9px;cursor:pointer;
    transition:background var(--dur-fast) var(--ease-out);
    border:1px solid var(--line);
  }
  .switch::after{
    content:'';position:absolute;top:1px;left:1px;width:14px;height:14px;
    border-radius:50%;background:#5C676E;
    transition:transform var(--dur-fast) var(--ease-out),
               background var(--dur-fast) var(--ease-out);
  }
  .switch.on{background:rgba(215,119,87,.25);border-color:rgba(215,119,87,.5)}
  .switch.on::after{transform:translateX(14px);background:var(--accent)}

  .num-input{
    width:64px;padding:5px 8px;background:var(--raised);
    border:1px solid var(--line);border-radius:5px;
    color:var(--ink);font-family:var(--mono);font-size:12px;
    outline:none;text-align:right;
    transition:border-color var(--dur-fast) var(--ease-out);
  }
  .num-input:focus{border-color:#3A464E}
  .num-input:disabled{opacity:.4;cursor:not-allowed}

  /* ═══ 配色方案 ═══ */
  .palette-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .palette-item{
    padding:6px 5px;background:var(--raised);border:1px solid var(--line);border-radius:5px;
    cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .palette-item:hover{border-color:#3A464E;background:#1C2328;transform:translateY(-1px)}
  .palette-item:active{transform:translateY(0) scale(.98)}
  .palette-swatches{display:flex;gap:2px;width:100%;justify-content:center}
  .palette-swatches i{width:8px;height:8px;border-radius:2px;display:block}
  .palette-name{font-size:9.5px;color:#6B767C;letter-spacing:.03em}

  .random-row{display:flex;gap:8px;margin-top:8px}
  .random-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 12px;background:var(--raised);border:1px solid var(--line);border-radius:5px;
    color:#8B959B;font-size:12px;font-family:inherit;cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .random-btn:hover{border-color:rgba(225,252,173,.4);color:var(--lime);background:rgba(225,252,173,.05)}
  .random-btn svg{width:12px;height:12px}

  /* ═══ 数据 ═══ */
  .data-tools{display:flex;gap:8px}
  .data-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 12px;background:var(--raised);border:1px solid var(--line);border-radius:6px;
    color:#8B959B;font-size:12.5px;font-family:inherit;cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .data-btn:hover{border-color:#3A464E;color:var(--ink);background:#1C2328}
  .data-btn svg{width:13px;height:13px}

  .footnote{
    margin-top:auto;padding-top:6px;font-size:11px;line-height:1.7;
    color:#4F5A61;border-top:1px solid var(--line);
  }
  .footnote code{
    font-family:var(--mono);color:#6E7A80;
    background:rgba(255,255,255,.035);padding:1px 4px;border-radius:3px;
  }

  /* ═══ 画布 ═══ */
  .stage{position:relative;flex:1;min-width:0;overflow:hidden}
  canvas{display:block;cursor:crosshair;touch-action:none}

  .readout{
    position:absolute;top:16px;right:16px;display:flex;gap:16px;
    padding:8px 13px;background:rgba(14,18,20,.82);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:6px;
    font-family:var(--mono);font-size:12px;color:var(--dim);
    pointer-events:none;font-variant-numeric:tabular-nums;
  }
  .readout b{color:var(--ink);font-weight:500}

  .zoombar{
    position:absolute;left:16px;bottom:16px;display:flex;gap:3px;padding:4px;
    background:rgba(14,18,20,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:6px;
  }
  .zoombar button{
    min-width:30px;height:28px;padding:0 9px;display:grid;place-items:center;
    background:transparent;border:none;border-radius:4px;
    color:#8B959B;font-size:14px;font-family:inherit;cursor:pointer;
    transition:all var(--dur-fast) var(--ease-out);
  }
  .zoombar button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  .zoombar button.reset{font-size:12px;color:#6E7A80}

  .legend{
    position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;
    padding:10px 13px;min-width:170px;background:rgba(14,18,20,.86);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:6px;
    font-family:var(--mono);font-size:11.5px;
    opacity:0;transform:translateY(6px);
    transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);
    pointer-events:none;
  }
  .legend.show{opacity:1;transform:none}
  .lg-row{display:flex;align-items:center;gap:8px}
  .lg-row i{width:8px;height:8px;border-radius:2px;flex:none}
  .lg-eq{
    flex:1;min-width:0;color:#8B959B;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;max-width:130px;
  }
  .lg-row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  .pen-badge{
    position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:8px;
    padding:7px 12px;background:rgba(225,252,173,.10);
    border:1px solid rgba(225,252,173,.35);border-radius:6px;
    font-size:12px;color:var(--lime);pointer-events:none;
    opacity:0;transform:translateY(-6px);
    transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);
  }
  .pen-badge.show{opacity:1;transform:none}
  .pen-badge svg{width:13px;height:13px;flex:none}
  .pen-badge kbd{
    font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;
    background:rgba(225,252,173,.14);color:var(--lime);
  }

  /* ═══ 类型菜单 ═══ */
  .type-menu{
    position:fixed;z-index:200;
    background:rgba(20,25,28,.98);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:8px;padding:5px;
    box-shadow:0 12px 32px -8px rgba(0,0,0,.6);
    opacity:0;transform:translateY(-4px) scale(.97);transform-origin:top left;
    pointer-events:none;
    transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);
  }
  .type-menu.show{opacity:1;transform:none;pointer-events:auto}
  .type-item{
    display:flex;align-items:center;gap:10px;
    padding:7px 10px;border-radius:5px;cursor:pointer;
    color:#8B959B;font-size:12.5px;
    transition:all var(--dur-fast) var(--ease-out);
    min-width:160px;
  }
  .type-item:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .type-item.on{color:var(--accent)}
  .type-item-icon{
    width:22px;height:22px;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.04);border-radius:4px;
    font-family:var(--mono);font-size:11px;font-weight:600;
  }
  .type-item.on .type-item-icon{background:rgba(215,119,87,.14);color:var(--accent)}
  .type-item-sub{font-size:10.5px;color:#4F5A61;margin-left:auto;font-family:var(--mono)}

  /* ═══ Toast ═══ */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);
    padding:9px 16px;background:rgba(20,25,28,.96);
    border:1px solid var(--line);border-radius:6px;
    font-size:12.5px;color:var(--ink);
    opacity:0;pointer-events:none;z-index:300;max-width:80vw;
    transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.error{border-color:rgba(215,119,87,.6);color:#F0A98F}

  /* ═══ 焦点 ═══ */
  button:focus-visible,.add-btn:focus-visible,.chip:focus-visible,
  .fn-input:focus-visible,.pen-toggle:focus-visible,.pen-clear:focus-visible,
  .pen-icon:focus-visible,.data-btn:focus-visible,.num-input:focus-visible,
  .type-badge:focus-visible,.random-btn:focus-visible,.palette-item:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  .fn-input:focus-visible{outline-offset:0}

  @keyframes rise-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion:no-preference){
    .reveal{opacity:0;animation:rise-in var(--dur-slow) var(--ease-out) forwards;
            animation-delay:calc(var(--i,0)*55ms)}
    .fn-row.is-new{animation:row-in var(--dur-base) var(--ease-out)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
    .reveal{opacity:1}
  }
  @media (max-width:880px){
    .app{flex-direction:column}
    .panel{width:100%;border-right:none;border-bottom:1px solid var(--line);
           max-height:56dvh;padding:16px 14px 12px}
    .stage{flex:1;min-height:0}
    .legend{display:none}
    .pen-badge{display:none}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="panel">

    <header class="head reveal" style="--i:0">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17c2.6 0 3.4-10 6.6-10S13 15 16 15s2.4-4 5-4"/>
        </svg>
      </div>
      <div>
        <h1>函数显示器</h1>
        <p>公式、隐式、极坐标、参数、点</p>
      </div>
    </header>

    <section class="reveal" style="--i:1">
      <div class="label">表达式</div>
      <div class="fn-list" id="fnList"></div>
      <button class="add-btn" id="addBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        再加一条
      </button>
    </section>

    <section class="reveal" style="--i:2">
      <div class="label">随手试试</div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="reveal" style="--i:3">
      <div class="label">画笔 · 两点定直线</div>
      <div class="pen-panel">
        <button class="pen-toggle" id="penToggle" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 3.5a2.1 2.1 0 0 1 3 3L7 18l-4 1 1-4Z"/>
          </svg>
          <span id="penToggleText">开启画笔</span>
        </button>
        <button class="pen-icon" id="penUndo" title="撤销上一次画笔生成" aria-label="撤销">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-3"/>
          </svg>
        </button>
        <button class="pen-clear" id="penClear" title="清空画笔生成的内容">清空</button>
      </div>
      <div class="pen-row">
        <span class="pen-row-label">色</span>
        <div class="pen-colors" id="penColors"></div>
      </div>
      <div class="pen-row">
        <span class="pen-row-label">点大小</span>
        <input type="range" class="pen-size" id="penSize" min="1" max="6" step="0.5" value="2.5">
      </div>
    </section>

    <section class="reveal" style="--i:4">
      <div class="label">设置</div>
      <div class="setting-row">
        <div class="switch" id="swSnap" role="switch" aria-checked="false" tabindex="0"></div>
        <label for="swSnap">网格吸附</label>
        <input class="num-input" id="snapStep" type="number" value="0.5" min="0.01" step="0.1"

<script>
/* ═══════════════════════════════════════════════════
   0. 基础
   ═══════════════════════════════════════════════════ */

const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)');

/* ═══════════════════════════════════════════════════
   1. 数学函数与常量
   ═══════════════════════════════════════════════════ */

const CONSTS = { pi:Math.PI, PI:Math.PI, e:Math.E, E:Math.E, tau:Math.PI*2 };

const fn1 = f => ({ arity:1, f });
const fn2 = f => ({ arity:2, f });
const fnN = f => ({ arity:-1, f });

const FUNCS = {
  sin:fn1(Math.sin), cos:fn1(Math.cos), tan:fn1(Math.tan),
  asin:fn1(Math.asin), arcsin:fn1(Math.asin),
  acos:fn1(Math.acos), arccos:fn1(Math.acos),
  atan:fn1(Math.atan), arctan:fn1(Math.atan),
  sinh:fn1(Math.sinh), cosh:fn1(Math.cosh), tanh:fn1(Math.tanh),
  ln:fn1(Math.log), log:fn1(Math.log10), log2:fn1(Math.log2), log10:fn1(Math.log10),
  exp:fn1(Math.exp), sqrt:fn1(Math.sqrt), cbrt:fn1(Math.cbrt),
  abs:fn1(Math.abs), floor:fn1(Math.floor), ceil:fn1(Math.ceil),
  round:fn1(Math.round), sign:fn1(Math.sign),
  min:fnN((...a)=>Math.min(...a)),
  max:fnN((...a)=>Math.max(...a)),
  pow:fn2(Math.pow), atan2:fn2(Math.atan2),
  mod:fn2((a,b)=>a-b*Math.floor(a/b)),
};

const COMPARISONS = new Set(['<','>','<=','>=','==','!=']);

function compare(a, b, op){
  switch(op){
    case '<':  return a < b;
    case '>':  return a > b;
    case '<=': return a <= b;
    case '>=': return a >= b;
    case '==': return a === b;
    case '!=': return a !== b;
  }
  return false;
}
const truthy = v => v !== 0 && !Number.isNaN(v);

/* ═══════════════════════════════════════════════════
   2. 词法 / 语法
   ═══════════════════════════════════════════════════ */

function tokenize(src){
  const s = src.replace(/\s+/g, '');
  const out = [];
  let i = 0;
  while (i < s.length){
    const c = s[i], c2 = s[i+1];
    if ((c==='<'||c==='>') && c2==='='){ out.push({t:c+'='}); i+=2; continue; }
    if (c==='=' && c2==='='){ out.push({t:'=='}); i+=2; continue; }
    if (c==='!' && c2==='='){ out.push({t:'!='}); i+=2; continue; }
    if (c==='&' && c2==='&'){ out.push({t:'&&'}); i+=2; continue; }
    if (c==='|' && c2==='|'){ out.push({t:'||'}); i+=2; continue; }

    if (/[0-9.]/.test(c)){
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      if (s[j]==='e' || s[j]==='E'){
        let k = j+1;
        if (s[k]==='+' || s[k]==='-') k++;
        if (/[0-9]/.test(s[k]||'')){
          while (k < s.length && /[0-9]/.test(s[k])) k++;
          j = k;
        }
      }
      const num = parseFloat(s.slice(i, j));
      if (!isFinite(num)) throw new Error('数字写错了');
      out.push({ t:'num', v:num });
      i = j;
    } else if (/[a-zA-Z_]/.test(c)){
      let j = i;
      while (j < s.length && /[a-zA-Z_0-9]/.test(s[j])) j++;
      out.push({ t:'id', v:s.slice(i, j) });
      i = j;
    } else if (c==='='){ out.push({t:'=='}); i++; }
    else if (c==='&'){ out.push({t:'&&'}); i++; }
    else if (c==='|'){ out.push({t:'||'}); i++; }
    else if ('+-*/^%(),{}<>!'.includes(c)){ out.push({t:c}); i++; }
    else throw new Error('看不懂这个符号：' + c);
  }
  return out;
}

/* 编译时接收变量名数组，变量按位置取 args[idx] */
function compile(src, varNames){
  if (!src || !src.trim()) throw new Error('空的');
  let s = src.trim().replace(/^\s*(y|f\s*\(\s*x\s*\)|r)\s*=\s*/i, '');

  const tokens = tokenize(s);
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  const need = t => {
    if (!peek() || peek().t !== t) throw new Error('这里少了个 ' + t);
    return next();
  };

  function parseOr(){
    let left = parseAnd();
    while (peek() && peek().t === '||'){
      next();
      const r = parseAnd(), l = left;
      left = (...a) => (truthy(l(...a)) || truthy(r(...a))) ? 1 : 0;
    }
    return left;
  }
  function parseAnd(){
    let left = parseComparison();
    while (peek() && peek().t === '&&'){
      next();
      const r = parseComparison(), l = left;
      left = (...a) => (truthy(l(...a)) && truthy(r(...a))) ? 1 : 0;
    }
    return left;
  }
  function parseComparison(){
    const first = parseExpr();
    const ops = [], vals = [first];
    while (peek() && COMPARISONS.has(peek().t)){
      ops.push(next().t);
      vals.push(parseExpr());
    }
    if (ops.length === 0) return first;
    if (ops.length === 1){
      const a = vals[0], b = vals[1], op = ops[0];
      return (...args) => compare(a(...args), b(...args), op) ? 1 : 0;
    }
    return (...args) => {
      for (let i = 0; i < ops.length; i++){
        if (!compare(vals[i](...args), vals[i+1](...args), ops[i])) return 0;
      }
      return 1;
    };
  }
  function parseExpr(){
    let left = parseTerm();
    while (peek() && (peek().t === '+' || peek().t === '-')){
      const op = next().t;
      const r = parseTerm(), l = left;
      left = op === '+' ? (...a)=>l(...a)+r(...a) : (...a)=>l(...a)-r(...a);
    }
    return left;
  }
  function parseTerm(){
    let left = parseUnary();
    for(;;){
      const tk = peek();
      if (!tk) break;
      if (tk.t === '*' || tk.t === '/' || tk.t === '%'){
        next();
        const r = parseUnary(), l = left, op = tk.t;
        if (op === '*')      left = (...a)=>l(...a)*r(...a);
        else if (op === '/') left = (...a)=>l(...a)/r(...a);
        else                 left = (...a)=>l(...a)%r(...a);
      } else if (tk.t === 'num' || tk.t === 'id' || tk.t === '('){
        const r = parseUnary(), l = left;
        left = (...a)=>l(...a)*r(...a);
      } else break;
    }
    return left;
  }
  function parseUnary(){
    const tk = peek();
    if (tk && tk.t === '-'){ next(); const v = parseUnary(); return (...a)=>-v(...a); }
    if (tk && tk.t === '+'){ next(); return parseUnary(); }
    if (tk && tk.t === '!'){ next(); const v = parseUnary(); return (...a)=>truthy(v(...a))?0:1; }
    return parseConditional();
  }
  function parseConditional(){
    const base = parsePower();
    const conds = [];
    while (peek() && peek().t === '{'){
      next();
      conds.push(parseOr());
      need('}');
    }
    if (conds.length === 0) return base;
    return (...a) => {
      for (let i = 0; i < conds.length; i++){
        if (!truthy(conds[i](...a))) return NaN;
      }
      return base(...a);
    };
  }
  function parsePower(){
    const base = parseAtom();
    if (peek() && peek().t === '^'){
      next();
      const e = parseUnary(), b = base;
      return (...a)=>Math.pow(b(...a), e(...a));
    }
    return base;
  }
  function parseAtom(){
    const tk = next();
    if (!tk) throw new Error('表达式没写完');
    if (tk.t === 'num'){ const v = tk.v; return ()=>v; }

    if (tk.t === 'id'){
      const name = tk.v;
      if (peek() && peek().t === '('){
        next();
        const args = [];
        if (peek() && peek().t !== ')'){
          args.push(parseOr());
          while (peek() && peek().t === ','){ next(); args.push(parseOr()); }
        }
        need(')');
        const spec = FUNCS[name.toLowerCase()];
        if (!spec) throw new Error('不认识的函数：' + name);
        if (spec.arity >= 0 && args.length !== spec.arity)
          throw new Error(`${name} 要 ${spec.arity} 个参数，你给了 ${args.length} 个`);
        const A = args;
        return (...x) => spec.f(...A.map(g => g(...x)));
      }
      if (name in CONSTS){ const v = CONSTS[name]; return ()=>v; }

      const idx = varNames.indexOf(name);
      if (idx >= 0) return (...args) => args[idx];

      throw new Error('不认识的变量：' + name);
    }
    if (tk.t === '('){
      const inner = parseOr();
      need(')');
      return inner;
    }
    throw new Error('这里多了个 ' + tk.t);
  }

  const fn = parseOr();
  if (pos < tokens.length){
    const t = tokens[pos];
    throw new Error('多余的符号：' + (t.v !== undefined ? t.v : t.t));
  }
  return fn;
}

/* 顶层逗号拆分：用于参数方程 (x(t), y(t)) */
function splitTopLevel(s){
  const parts = [];
  let depth = 0, cur = '';
  for (const c of s){
    if ('([{'.includes(c)) depth++;
    else if (')]}'.includes(c)) depth--;
    if (c === ',' && depth === 0){ parts.push(cur); cur = ''; continue; }
    cur += c;
  }
  parts.push(cur);
  return parts.map(p => p.trim()).filter(p => p !== '');
}

/* ═══════════════════════════════════════════════════
   3. 图形类型
   ═══════════════════════════════════════════════════ */

const TYPES = {
  y: {
    key:'y', label:'函数', icon:'y', sub:'y = f(x)',
    vars:['x'], placeholder:'sin(x)',
    hint:'只含 x',
  },
  implicit: {
    key:'implicit', label:'隐函数', icon:'◇', sub:'f(x,y)=0',
    vars:['x','y'], placeholder:'x^2+y^2-4',
    hint:'含 x 和 y',
  },
  polar: {
    key:'polar', label:'极坐标', icon:'θ', sub:'r = f(t)',
    vars:['t'], placeholder:'1+cos(t)',
    hint:'含 t 作为角度',
  },
  parametric: {
    key:'parametric', label:'参数方程', icon:'(t)', sub:'(x(t), y(t))',
    vars:['t'], placeholder:'cos(t), sin(t)',
    hint:'逗号分隔两个式子',
  },
  point: {
    key:'point', label:'点', icon:'·', sub:'(a, b)',
    vars:null, placeholder:'1, 2',
    hint:'一对坐标',
  },
};

/* ═══════════════════════════════════════════════════
   4. 状态
   ═══════════════════════════════════════════════════ */

const PALETTE = ['#D97757','#E1FCAD','#7EC8C8','#C9A84C','#C5B8D4','#A8B89A'];
const PEN_COLORS = ['#E1FCAD','#D97757','#7EC8C8','#C9A84C','#C5B8D4','#E7E9E6'];

const COLOR_POOL = [
  '#D97757','#E1FCAD','#7EC8C8','#C9A84C','#C5B8D4','#A8B89A',
  '#E8A87C','#8DA9C4','#B5C99A','#D4A5A5','#9B9ECE','#7EB09B',
  '#E0C097','#A3B5C9','#C9A5B0','#8FBC8F','#B0A8C8','#D9C5A0',
];

const PALETTE_PRESETS = [
  { key:'claude', name:'暖调',  colors:['#D97757','#E1FCAD','#7EC8C8','#C9A84C','#C5B8D4','#A8B89A'] },
  { key:'earth',  name:'陶土',  colors:['#D97757','#C9A84C','#A0522D','#8D6959','#E0C097','#A8B89A'] },
  { key:'forest', name:'苔原',  colors:['#A8B89A','#6B7D5A','#E1FCAD','#C9A84C','#7EB09B','#8DA9C4'] },
  { key:'ocean',  name:'海盐',  colors:['#539DB6','#7EC8C8','#8DA9C4','#A3B5C9','#9B9ECE','#E1FCAD'] },
  { key:'dusk',   name:'暮色',  colors:['#C5B8D4','#9B9ECE','#A3B5C9','#D4A5A5','#C9A5B0','#E8A87C'] },
  { key:'mono',   name:'素墨',  colors:['#E7E9E6','#B0B8BC','#7E8A90','#9CA8AE','#D0D5D7','#566168'] },
];

const state = {
  funcs: [],
  view: { cx:0, cy:0, scale:56 },
  settings: { snap:false, snapStep:0.5, showGrid:true, showTicks:true },
};

const pen = {
  active:false, color:PEN_COLORS[0], size:2.5,
  pending:null, cursor:null,
};

let uid = 0;

function makeFunc(typeKey, expr, source){
  return {
    id: ++uid,
    type: typeKey,
    expr: expr,
    color: PALETTE[state.funcs.length % PALETTE.length],
    visible: true,
    alpha: 1,
    source: source || 'manual',
    fn: null,
    error: null,
    _from: 1, _start: 0, _dur: 180,
  };
}

function recompile(f){
  f.fn = null; f.error = null;
  const t = TYPES[f.type];
  if (!t){ f.error = '未知类型'; return; }

  if (!f.expr || !f.expr.trim()){ f.error = '空的'; return; }

  try {
    if (f.type === 'parametric'){
      const parts = splitTopLevel(f.expr);
      if (parts.length !== 2)
        throw new Error('参数方程要写成 "x(t), y(t)" 两个式子');
      f.fn = [
        compile(parts[0], t.vars),
        compile(parts[1], t.vars),
      ];
    } else if (f.type === 'point'){
      const parts = splitTopLevel(f.expr.replace(/^\(|\)$/g, ''));
      if (parts.length !== 2) throw new Error('点要写成 "a, b"');
      const ax = compile(parts[0], []), ay = compile(parts[1], []);
      f.fn = (...a) => [ax(), ay()];
    } else {
      f.fn = compile(f.expr, t.vars);
    }
  } catch(e){ f.fn = null; f.error = e.message; }
}

function addFunc(typeKey, expr, source, colorIdx){
  const f = makeFunc(typeKey, expr, source);
  if (colorIdx != null) f.color = PALETTE[colorIdx % PALETTE.length];
  recompile(f);
  state.funcs.push(f);
  return f;
}

/* 初始示例 */
addFunc('y', 'sin(x)', 'manual', 0);
addFunc('y', 'x^2/4 - 2', 'manual', 1);

/* ═══════════════════════════════════════════════════
   5. DOM 引用
   ═══════════════════════════════════════════════════ */

const stage    = document.getElementById('stage');

const penToggleText = document.getElementById('penToggleText');

const ICON_EYE_ON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>`;
const ICON_EYE_OFF= `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16"/><path d="M9.6 5.7A9.6 9.6 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.3 4"/><path d="M6.5 7.7A17 17 0 0 0 2 12s3.6 6.5 10 6.5a9.9 9.9 0 0 0 4-.8"/><path d="M10.2 10.3a2.6 2.6 0 0 0 3.6 3.6"/></svg>`;
const ICON_X      = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let toastTimer = null;
function toast(msg, kind){
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', kind === 'error');
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* ═══════════════════════════════════════════════════
   6. 表达式列表
   ═══════════════════════════════════════════════════ */

function renderList(newId){
  fnList.innerHTML = '';
  state.funcs.forEach(f => {
    const slot = document.createElement('div');
    slot.className = 'fn-slot';

    const t = TYPES[f.type];
    const row = document.createElement('div');
    row.className = 'fn-row'
      + (f.error && f.expr.trim() ? ' error' : '')
      + (f.id === newId ? ' is-new' : '')
      + (f.source === 'pen' ? ' pen-made' : '');
    row.dataset.id = f.id;

    row.innerHTML = `
      <button class="type-badge" title="${esc(t.label)} · ${esc(t.sub)}"
              aria-label="切换图形类型">${esc(t.icon)}</button>
      <button class="swatch" style="--c:${f.color}" title="换个颜色" aria-label="切换颜色"></button>
      <input class="fn-input" spellcheck="false" autocomplete="off"
             value="${esc(f.expr)}" placeholder="${esc(t.placeholder)}"
             aria-label="表达式">
      <button class="icon-btn vis ${f.visible ? '' : 'off'}"
              title="${f.visible ? '藏起来' : '显示出来'}"
              aria-label="${f.visible ? '隐藏' : '显示'}"
              aria-pressed="${f.visible}">
        ${f.visible ? ICON_EYE_ON : ICON_EYE_OFF}
      </button>
      <button class="icon-btn del" title="删掉" aria-label="删除">${ICON_X}</button>
    `;

    const badge  = row.querySelector('.type-badge');
    const input  = row.querySelector('.fn-input');
    const swatch = row.querySelector('.swatch');
    const visBtn = row.querySelector('.vis');
    const delBtn = row.querySelector('.del');

    badge.addEventListener('click', e => {
      e.stopPropagation();
      openTypeMenu(badge, f);
    });

    input.addEventListener('input', e => {
      f.expr = e.target.value;
      recompile(f);
      const bad = !!f.error && f.expr.trim() !== '';
      row.classList.toggle('error', bad);
      row.title = bad ? f.error : '';
      requestRender();
      updateHUD();
    });

    swatch.addEventListener('click', () => {
      const i = PALETTE.indexOf(f.color);
      f.color = PALETTE[(i + 1 + PALETTE.length) % PALETTE.length];
      swatch.style.setProperty('--c', f.color);
      requestRender();
      updateHUD();
    });

    visBtn.addEventListener('click', () => {
      const nv = !f.visible;
      if (prefersReduced.matches){
        f.alpha = nv ? 1 : 0;
      } else {
        f._from = f.alpha;
        f._start = performance.now();
        f._dur = 180;
        ensureAnim();
      }
      f.visible = nv;
      visBtn.classList.toggle('off', !f.visible);
      visBtn.innerHTML = f.visible ? ICON_EYE_ON : ICON_EYE_OFF;
      visBtn.setAttribute('aria-pressed', String(f.visible));
      requestRender();
      updateHUD();
    });

    delBtn.addEventListener('click', () => {
      const finish = () => {
        state.funcs = state.funcs.filter(x => x.id !== f.id);
        if (state.funcs.length === 0) addFunc('y', '', 'manual', 0);
        renderList();
        requestRender();
        updateHUD();
      };
      if (prefersReduced.matches){ finish(); return; }
      slot.classList.add('closing');
      let done = false;
      const once = () => { if (done) return; done = true; finish(); };
      slot.addEventListener('transitionend', e => {
        if (e.propertyName === 'grid-template-rows') once();
      });
      setTimeout(once, 340);
    });

    slot.appendChild(row);
    fnList.appendChild(slot);
  });
}

/* ═══════════════════════════════════════════════════
   10. 画布尺寸 & 变换
   ═══════════════════════════════════════════════════ */

let W = 0, H = 0;
let noisePattern = null;

function buildNoise(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const nx = c.getContext('2d');
  const img = nx.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4){
    const v = 120 + Math.random() * 135;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 255;
  }
  nx.putImageData(img, 0, 0);
  noisePattern = ctx.createPattern(c, 'repeat');
}

function resize(){
  const r = stage.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!noisePattern) buildNoise();
  requestRender();
}
new ResizeObserver(resize).observe(stage);

const w2sX = x => (x - state.view.cx) * state.view.scale + W / 2;
const w2sY = y => H / 2 - (y - state.view.cy) * state.view.scale;
const s2wX = sx => (sx - W / 2) / state.view.scale + state.view.cx;
const s2wY = sy => state.view.cy - (sy - H / 2) / state.view.scale;
const screenToWorld = (sx, sy) => ({ x: s2wX(sx), y: s2wY(sy) });

/* ═══════════════════════════════════════════════════
   11. 渲染
   ═══════════════════════════════════════════════════ */

let needsRender = false;
function requestRender(){
  if (needsRender) return;
  needsRender = true;
  requestAnimationFrame(() => { needsRender = false; draw(); });
}

let animRaf = null;
function updateAlphas(){
  const now = performance.now();
  let busy = false;
  for (const f of state.funcs){
    const target = f.visible ? 1 : 0;
    if (f.alpha === target) continue;
    const t = Math.min(1, (now - f._start) / f._dur);
    const e = 1 - Math.pow(1 - t, 3);
    f.alpha = f._from + (target - f._from) * e;
    if (t < 1) busy = true;
    else f.alpha = target;
  }
  return busy;
}
function ensureAnim(){
  if (animRaf || prefersReduced.matches) return;
  animRaf = requestAnimationFrame(function step(){
    const busy = updateAlphas();
    draw();
    animRaf = busy ? requestAnimationFrame(step) : null;
  });
}

function niceStep(scale, targetPx){
  const raw = targetPx / scale;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const mult = norm <= 1.5 ? 1 : norm <= 3.5 ? 2 : norm <= 7.5 ? 5 : 10;
  return mult * mag;
}
function fmtTick(v, step){
  if (Math.abs(v) < step * 0.001) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || a < 1e-3) return v.toExponential(0).replace('e+', 'e');
  const dec = Math.max(0, -Math.floor(Math.log10(step)));
  return v.toFixed(Math.min(dec, 6));
}
function nf(v){
  if (!isFinite(v)) return '0';
  if (Math.abs(v) < 1e-9) return '0';
  let s = v.toFixed(4);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s || '0';
}

function draw(){
  if (!W || !H) return;
  const { cx, cy, scale } = state.view;
  const S = state.settings;

  /* 背景 */
  const g = ctx.createRadialGradient(W*.62, H*.12, 0, W*.62, H*.12, Math.max(W,H)*.95);
  g.addColorStop(0, '#182026');
  g.addColorStop(.55, '#121819');
  g.addColorStop(1, '#0C1012');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (noisePattern){
    ctx.globalAlpha = 0.028;
    ctx.fillStyle = noisePattern;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  const xMin = cx - W/2/scale, xMax = cx + W/2/scale;
  const yMin = cy - H/2/scale, yMax = cy + H/2/scale;

  /* 网格 */
  if (S.showGrid){
    const major = niceStep(scale, 88);
    const minor = major / 5;

    if (minor * scale >= 9){
      ctx.strokeStyle = 'rgba(232,236,238,.045)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = Math.ceil(xMin/minor); k*minor <= xMax; k++){
        const sx = Math.round((k*minor - cx)*scale + W/2) + .5;
        ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
      }
      for (let k = Math.ceil(yMin/minor); k*minor <= yMax; k++){
        const sy = Math.round(H/2 - (k*minor - cy)*scale) + .5;
        ctx.moveTo(0, sy); ctx.lineTo(W, sy);
      }
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(232,236,238,.095)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = Math.ceil(xMin/major); k*major <= xMax; k++){
      const sx = Math.round((k*major - cx)*scale + W/2) + .5;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
    }
    for (let k = Math.ceil(yMin/major); k*major <= yMax; k++){
      const sy = Math.round(H/2 - (k*major - cy)*scale) + .5;
      ctx.moveTo(0, sy); ctx.lineTo(W, sy);
    }
    ctx.stroke();
  }

  /* 坐标轴 */
  const y0 = H/2 - (0 - cy)*scale;
  const x0 = W/2 + (0 - cx)*scale;

  ctx.strokeStyle = 'rgba(232,236,238,.26)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  if (y0 >= -1 && y0 <= H+1){ ctx.moveTo(0, Math.round(y0)+.5); ctx.lineTo(W, Math.round(y0)+.5); }
  if (x0 >= -1 && x0 <= W+1){ ctx.moveTo(Math.round(x0)+.5, 0); ctx.lineTo(Math.round(x0)+.5, H); }
  ctx.stroke();

  /* 刻度 */
  if (S.showTicks){
    const major = niceStep(scale, 88);
    ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.fillStyle = '#57636A';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    const labY = Math.min(Math.max(y0, 15), H - 7);
    for (let k = Math.ceil(xMin/major); k*major <= xMax; k++){
      const v = k*major;
      if (Math.abs(v) < major*0.001) continue;
      ctx.fillText(fmtTick(v, major), (v - cx)*scale + W/2 + 4, labY - 6);
    }

    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const labX = Math.min(Math.max(x0, 26), W - 8);
    for (let k = Math.ceil(yMin/major); k*major <= yMax; k++){
      const v = k*major;
      if (Math.abs(v) < major*0.001) continue;
      ctx.fillText(fmtTick(v, major), labX - 7, H/2 - (v - cy)*scale);
    }
  }

  /* 曲线 */
  for (const f of state.funcs){
    if (f.alpha <= 0.002 || !f.fn || !f.visible) continue;
    switch(f.type){
      case 'y':          drawY(f);         break;
      case 'implicit':   drawImplicit(f);  break;
      case 'polar':      drawPolar(f);     break;
      case 'parametric': drawParametric(f);break;
      case 'point':      drawPoint(f);     break;
    }
  }
  ctx.globalAlpha = 1;

  /* 画笔预览 / 悬停 */
  if (pen.active) drawPenPreview();
  else drawHover();
}

/* ── y = f(x) ── */
function drawY(f){
  ctx.beginPath();
  const { cx, cy, scale } = state.view;
  let prevSy = null;
  const n = Math.ceil(W);

  for (let i = 0; i <= n; i++){
    const x = (i - W/2) / scale + cx;
    let y;
    try { y = f.fn(x); } catch { y = NaN; }
    if (typeof y !== 'number' || !isFinite(y)){ prevSy = null; continue; }
    let sy = H/2 - (y - cy)*scale;
    if (!isFinite(sy)){ prevSy = null; continue; }
    if (sy < -6000) sy = -6000; else if (sy > H+6000) sy = H+6000;

    if (prevSy === null || Math.abs(sy - prevSy) > H*3) ctx.moveTo(i, sy);
    else ctx.lineTo(i, sy);
    prevSy = sy;
  }

  strokeCurve(f);
}

/* ── 极坐标 ── */
function drawPolar(f){
  ctx.beginPath();
  const { cx, cy, scale } = state.view;
  const steps = 1200;
  const TAU = Math.PI * 2;

  let started = false;
  for (let i = 0; i <= steps; i++){
    const t = i / steps * TAU;
    let r;
    try { r = f.fn(t); } catch { r = NaN; }
    if (typeof r !== 'number' || !isFinite(r)){ started = false; continue; }
    const x = r * Math.cos(t), y = r * Math.sin(t);
    const sx = (x - cx)*scale + W/2;
    const sy = H/2 - (y - cy)*scale;
    if (!isFinite(sx) || !isFinite(sy)){ started = false; continue; }
    if (!started){ ctx.moveTo(sx, sy); started = true; }
    else ctx.lineTo(sx, sy);
  }

  strokeCurve(f);
}

/* ── 参数方程 ── */
function drawParametric(f){
  ctx.beginPath();
  const { cx, cy, scale } = state.view;
  const steps = 1200;
  const TAU = Math.PI * 2;

  let started = false;
  for (let i = 0; i <= steps; i++){
    const t = i / steps * TAU;
    let x, y;
    try { x = f.fn[0](t); y = f.fn[1](t); } catch { started = false; continue; }
    if (!isFinite(x) || !isFinite(y)){ started = false; continue; }
    const sx = (x - cx)*scale + W/2;
    const sy = H/2 - (y - cy)*scale;
    if (!isFinite(sx) || !isFinite(sy)){ started = false; continue; }
    if (!started){ ctx.moveTo(sx, sy); started = true; }
    else ctx.lineTo(sx, sy);
  }

  strokeCurve(f);
}

/* ── 隐函数：Marching Squares ── */
function drawImplicit(f){
  const { cx, cy, scale } = state.view;
  const cell = 6;
  const cols = Math.ceil(W / cell) + 1;
  const rows = Math.ceil(H / cell) + 1;

  const vals = new Float32Array(cols * rows);
  const vxArr = new Float32Array(cols);
  const vyArr = new Float32Array(rows);

  for (let i = 0; i < cols; i++) vxArr[i] = (i*cell - W/2)/scale + cx;
  for (let j = 0; j < rows; j++) vyArr[j] = cy - (j*cell - H/2)/scale;

  for (let j = 0; j < rows; j++){
    for (let i = 0; i < cols; i++){
      let v;
      try { v = f.fn(vxArr[i], vyArr[j]); } catch { v = NaN; }
      vals[j*cols + i] = (typeof v === 'number' && isFinite(v)) ? v : NaN;
    }
  }

  ctx.beginPath();
  const P = [];

  for (let j = 0; j < rows - 1; j++){
    for (let i = 0; i < cols - 1; i++){
      const v00 = vals[j*cols + i];
      const v10 = vals[j*cols + i + 1];
      const v11 = vals[(j+1)*cols + i + 1];
      const v01 = vals[(j+1)*cols + i];

      if (!isFinite(v00) || !isFinite(v10) || !isFinite(v11) || !isFinite(v01)) continue;
      if (v00 === 0) vals[j*cols + i] = 1e-9;

      const s00 = v00 > 0 ? 1 : 0;
      const s10 = v10 > 0 ? 1 : 0;
      const s11 = v11 > 0 ? 1 : 0;
      const s01 = v01 > 0 ? 1 : 0;

      const code = (s00 << 3) | (s10 << 2) | (s11 << 1) | s01;
      if (code === 0 || code === 15) continue;

      const x0 = i*cell, x1 = (i+1)*cell;
      const y0 = j*cell, y1 = (j+1)*cell;

      const tTop    = v00 / (v00 - v10);
      const tRight  = v10 / (v10 - v11);
      const tBottom = v01 / (v01 - v11);
      const tLeft   = v00 / (v00 - v01);

      const top    = { x: x0 + (x1-x0)*tTop,    y: y0 };
      const right  = { x: x1,                    y: y0 + (y1-y0)*tRight };
      const bottom = { x: x0 + (x1-x0)*tBottom, y: y1 };
      const left   = { x: x0,                    y: y0 + (y1-y0)*tLeft };

      const seg = (a, b) => {
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        P.push(a, b);
      };

      switch (code){
        case 1: case 14: seg(bottom, left); break;
        case 2: case 13: seg(right, bottom); break;
        case 3: case 12: seg(right, left); break;
        case 4: case 11: seg(top, right); break;
        case 6: case 9:  seg(top, bottom); break;
        case 7: case 8:  seg(top, left); break;
        case 5:  seg(top, left); seg(right, bottom); break;
        case 10: seg(top, right); seg(bottom, left); break;
      }
    }
  }

  ctx.globalAlpha = 0.14 * f.alpha;
  ctx.strokeStyle = f.color;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.globalAlpha = f.alpha;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.globalAlpha = 1;
}

/* ── 点 ── */
function drawPoint(f){
  let pt;
  try { pt = f.fn(); } catch { return; }
  if (!pt || !isFinite(pt[0]) || !isFinite(pt[1])) return;

  const sx = w2sX(pt[0]), sy = w2sY(pt[1]);
  if (sx < -20 || sx > W+20 || sy < -20 || sy > H+20) return;

  ctx.globalAlpha = f.alpha;
  ctx.beginPath();
  ctx.arc(sx, sy, 9, 0, Math.PI*2);
  ctx.fillStyle = f.color;
  ctx.globalAlpha = 0.18 * f.alpha;
  ctx.fill();

  ctx.globalAlpha = f.alpha;
  ctx.beginPath();
  ctx.arc(sx, sy, 4.5, 0, Math.PI*2);
  ctx.fillStyle = f.color;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* 通用：双层描边 */
function strokeCurve(f){
  ctx.globalAlpha = 0.14 * f.alpha;
  ctx.lineWidth = 7;
  ctx.strokeStyle = f.color;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.globalAlpha = f.alpha;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* ── 画笔预览 ── */
function drawPenPreview(){
  if (!pen.cursor) return;

  let cur = pen.cursor;
  if (state.settings.snap) cur = snapPoint(cur);

  const cpx = w2sX(cur.x), cpy = w2sY(cur.y);

  if (!pen.pending){
    ctx.strokeStyle = pen.color;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(cpx, cpy, 4, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cpx-8, cpy); ctx.lineTo(cpx-5, cpy);
    ctx.moveTo(cpx+5, cpy); ctx.lineTo(cpx+8, cpy);
    ctx.moveTo(cpx, cpy-8); ctx.lineTo(cpx, cpy-5);
    ctx.moveTo(cpx, cpy+5); ctx.lineTo(cpx, cpy+8);
    ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  }

  const s = pen.pending;
  const spx = w2sX(s.x), spy = w2sY(s.y);

  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.strokeStyle = pen.color;
  ctx.lineWidth = 1.8;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(spx, spy);
  ctx.lineTo(cpx, cpy);
  ctx.stroke();
  ctx.restore();

  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.arc(cpx, cpy, 3.2, 0, Math.PI*2);
  ctx.fillStyle = pen.color;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(spx, spy, 4.5, 0, Math.PI*2);
  ctx.fillStyle = pen.color;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(spx, spy, 9, 0, Math.PI*2);
  ctx.strokeStyle = pen.color;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.55;
  ctx.stroke();
  ctx.globalAlpha = 1;

  const label = `(${nf(s.x)}, ${nf(s.y)})`;
  ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
  const tw = ctx.measureText(label).width;
  let bx = spx + 14, by = spy - 12;
  if (bx + tw + 12 > W) bx = spx - tw - 20;
  if (by < 12) by = spy + 22;

  ctx.fillStyle = 'rgba(14,18,20,.86)';
  ctx.fillRect(bx - 4, by - 11, tw + 10, 18);
  ctx.fillStyle = pen.color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, bx, by - 1);
}

/* ── 悬停十字 ── */
let hover = null;

function drawHover(){
  if (!hover) return;
  const { cx, cy, scale } = state.view;
  const { mx, my } = hover;

  ctx.save();
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = 'rgba(232,236,238,.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(Math.round(mx)+.5, 0); ctx.lineTo(Math.round(mx)+.5, H);
  ctx.moveTo(0, Math.round(my)+.5); ctx.lineTo(W, Math.round(my)+.5);
  ctx.stroke();
  ctx.restore();

  const hx = (mx - W/2)/scale + cx;

  for (const f of state.funcs){
    if (f.alpha <= 0.002 || !f.fn || !f.visible) continue;
    if (f.type !== 'y') continue;

    let y;
    try { y = f.fn(hx); } catch { continue; }
    if (!isFinite(y)) continue;

    const sy = H/2 - (y - cy)*scale;
    if (sy < -24 || sy > H+24) continue;

    ctx.globalAlpha = f.alpha;
    ctx.beginPath();
    ctx.arc(mx, sy, 6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(12,16,18,.92)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(mx, sy, 3.6, 0, Math.PI*2);
    ctx.fillStyle = f.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ═══════════════════════════════════════════════════
   12. HUD
   ═══════════════════════════════════════════════════ */

function fmtShort(v){
  if (!isFinite(v)) return '∞';
  if (Math.abs(v) < 1e-12) return '0';
  const a = Math.abs(v);
  if (a >= 1e6 || a < 1e-4) return v.toExponential(2);
  return v.toFixed(4).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
}

function updateHUD(){
  const { cx, cy, scale } = state.view;

  if (!hover){
    hudX.textContent = '—';
    hudY.textContent = '—';
    legendEl.classList.remove('show');
    return;
  }

  const hx = (hover.mx - W/2)/scale + cx;
  const hy = cy - (hover.my - H/2)/scale;
  hudX.textContent = fmtShort(hx);
  hudY.textContent = fmtShort(hy);

  const live = state.funcs.filter(f => f.visible && f.fn && f.type === 'y');
  if (live.length === 0){ legendEl.classList.remove('show'); return; }

  legendEl.innerHTML = live.map(f => {
    let v;
    try { v = f.fn(hx); } catch { v = NaN; }
    const txt = (typeof v === 'number' && isFinite(v)) ? fmtShort(v) : '未定义';
    return `<div class="lg-row">
      <i style="background:${f.color}"></i>
      <span class="lg-eq">${esc(f.expr || '—')}</span>
      <b>${txt}</b>
    </div>`;
  }).join('');
  legendEl.classList.add('show');
}

/* ═══════════════════════════════════════════════════
   13. 交互
   ═══════════════════════════════════════════════════ */

let drag = null;

function buildLineExpr(p1, p2){
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  if (Math.abs(dx) < 1e-9) return null;

  const k = dy / dx;
  const b = p1.y - k * p1.x;
  const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);

  let kPart = '';
  if (Math.abs(k) > 1e-9){
    if (Math.abs(k - 1) < 1e-9) kPart = 'x';
    else if (Math.abs(k + 1) < 1e-9) kPart = '-x';
    else kPart = nf(k) + '*x';
  }

  let bPart = '';
  if (Math.abs(b) > 1e-9){
    if (kPart === '') bPart = nf(b);
    else bPart = b > 0 ? ('+' + nf(b)) : ('-' + nf(-b));
  }

  let core;
  if (kPart === '' && bPart === '') core = '0';
  else if (kPart === '') core = bPart;
  else if (bPart === '') core = kPart;
  else core = kPart + bPart;

  return `(${core}){${nf(minX)}<=x&&x<=${nf(maxX)}}`;
}

function buildDotExpr(p, sizePx){
  const eps = Math.max(sizePx, 1) / state.view.scale;
  const half = eps / 2;
  return `(${nf(p.y)}){${nf(p.x-half)}<=x&&x<=${nf(p.x+half)}}`;
}

function handlePenClick(mx, my){
  let world = screenToWorld(mx, my);
  world = snapPoint(world);
  pen.cursor = world;

  if (!pen.pending){
    pen.pending = world;
    updatePenBadge();
    requestRender();
    return;
  }

  const pixelDist = Math.hypot(
    (world.x - pen.pending.x) * state.view.scale,
    (world.y - pen.pending.y) * state.view.scale
  );

  let expr, isDot = false, msg;

  if (pixelDist < 8){
    isDot = true;
    expr = buildDotExpr(pen.pending, pen.size);
    msg = '已生成一个点';
  } else {
    expr = buildLineExpr(pen.pending, world);
    if (!expr){
      toast('垂直线没法写成 y=f(x)，换个位置', 'error');
      requestRender();
      return;
    }
    msg = '已生成一条线段';
  }

  const f = addFunc('y', expr, 'pen');
  f.color = pen.color;
  renderList(f.id);
  toast(msg + ' · 已追加');

  pen.pending = null;
  pen.cursor = world;
  updatePenBadge();
  requestRender();
  updateHUD();
}

canvas.addEventListener('pointerdown', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  canvas.setPointerCapture(e.pointerId);
  hover = { mx, my };

  if (pen.active){ handlePenClick(mx, my); return; }

  drag = { px:e.clientX, py:e.clientY, cx:state.view.cx, cy:state.view.cy };
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('pointermove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  hover = { mx, my };

  if (pen.active){
    pen.cursor = snapPoint(screenToWorld(mx, my));
    requestRender();
    updateHUD();
    return;
  }

  if (drag){
    const dx = e.clientX - drag.px;
    const dy = e.clientY - drag.py;
    state.view.cx = drag.cx - dx / state.view.scale;
    state.view.cy = drag.cy + dy / state.view.scale;
  }

  requestRender();
  updateHUD();
});

function endDrag(e){
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
  if (pen.active) return;
  if (drag){ drag = null; canvas.style.cursor = 'crosshair'; }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('pointerleave', () => {
  hover = null;
  if (!pen.active) drag = null;
  requestRender();
  updateHUD();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const unit = e.deltaMode === 1 ? 0.045 : 0.0018;
  zoomAt(mx, my, Math.exp(-e.deltaY * unit));
}, { passive:false });

function zoomAt(mx, my, factor){
  const { cx, cy, scale } = state.view;
  const bx = (mx - W/2)/scale + cx;
  const by = cy - (my - H/2)/scale;
  const ns = Math.min(Math.max(scale * factor, 0.4), 4000);
  state.view.scale = ns;
  state.view.cx = bx - (mx - W/2)/ns;
  state.view.cy = by + (my - H/2)/ns;
  requestRender();
  updateHUD();
}

document.querySelector('.zoombar').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const mode = btn.dataset.zoom;
  if (mode === 'reset'){
    state.view.cx = 0; state.view.cy = 0; state.view.scale = 56;
  } else {
    zoomAt(W/2, H/2, mode === 'in' ? 1.25 : 0.8);
    return;
  }
  requestRender();
  updateHUD();
});

/* ═══════════════════════════════════════════════════
   14. 导出 / 导入
   ═══════════════════════════════════════════════════ */

function exportJSON(){
  const data = {
    version: 3,
    app: 'function-plot',
    exported: new Date().toISOString(),
    view: {
      cx: +state.view.cx.toFixed(6),
      cy: +state.view.cy.toFixed(6),
      scale: +state.view.scale.toFixed(4),
    },
    settings: {
      snap: state.settings.snap,
      snapStep: state.settings.snapStep,
      showGrid: state.settings.showGrid,
      showTicks: state.settings.showTicks,
    },
    functions: state.funcs.map(f => ({
      type: f.type,
      expr: f.expr,
      color: f.color,
      visible: f.visible,
      source: f.source,
    })),
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  a.href = url;
  a.download = `plot-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('已导出 · ' + data.functions.length + ' 条');
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch { toast('文件不是合法 JSON', 'error'); return; }
    if (!data || typeof data !== 'object'){ toast('文件结构不对', 'error'); return; }

    try {
      if (data.view && typeof data.view === 'object'){
        const cx = Number(data.view.cx);
        const cy = Number(data.view.cy);
        const sc = Number(data.view.scale);
        if (isFinite(cx)) state.view.cx = cx;
        if (isFinite(cy)) state.view.cy = cy;
        if (isFinite(sc) && sc > 0) state.view.scale = Math.min(4000, Math.max(0.4, sc));
      }

      if (data.settings && typeof data.settings === 'object'){
        const s = data.settings;
        if (typeof s.snap === 'boolean') state.settings.snap = s.snap;
        if (isFinite(Number(s.snapStep)) && Number(s.snapStep) > 0)
          state.settings.snapStep = Number(s.snapStep);
        if (typeof s.showGrid === 'boolean') state.settings.showGrid = s.showGrid;
        if (typeof s.showTicks === 'boolean') state.settings.showTicks = s.showTicks;
        syncSettingsUI();
      }

      if (Array.isArray(data.functions)){
        state.funcs = [];
        for (const item of data.functions){
          if (!item) continue;
          const type = TYPES[item.type] ? item.type : 'y';
          let expr = item.expr;
          // 兼容 v2 参数方程存在 expr2 里
          if (type === 'parametric' && item.expr2 && !String(expr).includes(',')){
            expr = String(expr) + ', ' + String(item.expr2);
          }
          if (typeof expr !== 'string') continue;
          const nf2 = addFunc(type, expr, item.source === 'pen' ? 'pen' : 'manual');
          if (typeof item.color === 'string' && /^#[0-9a-f]{3,8}$/i.test(item.color)){
            nf2.color = item.color;
          }
          if (item.visible === false){ nf2.visible = false; nf2.alpha = 0; }
        }
        if (state.funcs.length === 0) addFunc('y', '', 'manual', 0);
      }

      pen.pending = null;
      pen.cursor = null;

      renderList(); requestRender(); updateHUD(); updatePenBadge();
      toast('导入成功 · ' + state.funcs.length + ' 条');
    } catch(e){
      toast('导入出错：' + e.message, 'error');
    }
  };
  reader.onerror = () => toast('读文件失败', 'error');
  reader.readAsText(file);
}

function syncSettingsUI(){
  document.getElementById('swSnap').classList.toggle('on', state.settings.snap);
  document.getElementById('swSnap').setAttribute('aria-checked', String(state.settings.snap));
  document.getElementById('swGrid').classList.toggle('on', state.settings.showGrid);
  document.getElementById('swGrid').setAttribute('aria-checked', String(state.settings.showGrid));
  document.getElementById('swTicks').classList.toggle('on', state.settings.showTicks);
  document.getElementById('swTicks').setAttribute('aria-checked', String(state.settings.showTicks));
  snapStepInput.value = String(state.settings.snapStep);
}

document.getElementById('exportBtn').addEventListener('click', exportJSON);

const fileInput = document.getElementById('fileInput');
document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (file) importJSON(file);
  fileInput.value = '';
});

/* ═══════════════════════════════════════════════════
   15. 键盘
   ═══════════════════════════════════════════════════ */

window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  const inField = tag === 'INPUT' || tag === 'TEXTAREA';

  if (e.key === 'Escape'){
    if (typeMenu.classList.contains('show')) return; // 已在菜单里处理
    if (pen.pending){
      e.preventDefault();
      pen.pending = null; pen.cursor = null;
      updatePenBadge(); requestRender();
      toast('已取消起点');
    }
    return;
  }

  if (e.key === '0' && (e.metaKey || e.ctrlKey)){
    e.preventDefault();
    state.view.cx = 0; state.view.cy = 0; state.view.scale = 56;
    requestRender(); updateHUD();
    return;
  }

  if (inField) return;

  if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')){
    e.preventDefault();
    undoStroke();
    return;
  }

  if ((e.key === 'b' || e.key === 'B') && !e.metaKey && !e.ctrlKey && !e.altKey){
    e.preventDefault();
    setPenActive(!pen.active);
  }
});

/* ═══════════════════════════════════════════════════
   16. 启动
   ═══════════════════════════════════════════════════ */

syncSettingsUI();
resize();
requestRender();
</script>
